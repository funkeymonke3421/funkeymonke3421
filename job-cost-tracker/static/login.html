<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Job Cost Tracker · Log in</title>
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body { padding: 0; min-height: 100vh; display: grid; place-items: center; }
    .login { width: min(100% - 32px, 380px); }
    .login img { width: 64px; height: 64px; border-radius: 16px; display: block; margin: 0 auto 14px; }
    .login h1 { text-align: center; font-size: 1.4rem; margin-bottom: 18px; }
    .login .card { padding: 20px; }
  </style>
</head>
<body>
  <main class="login">
    <img src="/static/icons/icon-192.png" alt="">
    <h1>Job Cost</h1>
    <form class="card" id="loginForm" novalidate>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" autofocus required>
      </label>
      <p class="form-error" id="err" role="alert"></p>
      <button class="primary" type="submit">Log in</button>
    </form>
    <div class="card hidden" id="noPassword">
      <h3>No password set yet</h3>
      <p class="muted small">For safety, the app won't open online until it has a password.
        Open a console where the app is installed and run:</p>
      <pre style="white-space:pre-wrap;margin:10px 0 0"><code>python3 app.py set-password</code></pre>
      <p class="muted small">Then reload this page.</p>
    </div>
  </main>
  <script>
    "use strict";
    const form = document.getElementById("loginForm");
    const err = document.getElementById("err");
    fetch("/api/auth").then((r) => r.json()).then((a) => {
      if (a.logged_in || a.open) location.replace("/");
      else if (!a.password_set) {
        form.classList.add("hidden");
        document.getElementById("noPassword").classList.remove("hidden");
      }
    }).catch(() => {});
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      const btn = form.querySelector("button");
      btn.disabled = true;
      try {
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: form.password.value }),
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok) location.replace("/");
        else { err.textContent = data.error || "Couldn't log in."; form.password.select(); }
      } catch { err.textContent = "Can't reach the app. Check your connection."; }
      btn.disabled = false;
    });
  </script>
</body>
</html>
